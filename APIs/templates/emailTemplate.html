<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <style>
    * {
      font-family: Helvetica;
    }

    code {
      font-family: 'Courier New', Courier, monospace;
    }

    h2 {
      margin-top: 15px;
      margin-bottom: 5px;
    }

    table {
      padding: 0;
      text-align: left;
      border-spacing: 0;
      border-collapse: collapse;
    }

    table td,
    table th {
      padding: 5px;
    }

    table tfoot td {
      padding: 0;
    }

    .highlight {
    background-color: yellow;
}

    .bordered-table,
    .bordered-table th,
    .bordered-table td
    {
        border: 1px solid #333;
    }

    .sectionTable {
      border-collapse: separate;
      padding: 0;
      border: 2.0px solid {border};
      width: 100%;
    }

    .sectionHeader {
      color: {color};
      font-size: 32;
      background-color: {background};
      text-align: left;
    }

    .sectionTd {
      padding-bottom: 30px;
    }

    .alert-info {
      color: #004085;
      background-color: #cce5ff;
      padding: 5px;
      padding-bottom: 5px;
      border: 1px solid #b8daff;
    }
  </style>
</head>
<html>

<body>
  {header}
  <table style="width:100%">
    <tbody>
      <tr>
        <td>
          <table class="sectionTable">
            {content}
            <tfoot>
              <tr>
                <td><img src="https://potatofarm.intel.com/img/external/farm-{img-color}.jpg" width="100%"></td>
              </tr>
            </tfoot>
          </table>
        </td>
        <td rowspan="2" style="vertical-align: bottom">
          <img src="https://potatofarm.intel.com/img/external/sherlock.jpg">
        </td>
      </tr>
      <tr>
        <td>
          Sincerely,<br>
          - The <a href="mailto:wcc.wifi.windows.driver.devops@intel.com">WCC WiFi Windows Driver DevOps</a> Team
        </td>
      </tr>
    </tbody>
  </table>
</body>

</html>
